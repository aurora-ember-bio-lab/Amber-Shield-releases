[package]
name = "core-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

# core-engine is deliberately UI/framework agnostic: no Tauri types leak in
# here. The tauri-app crate is a thin adapter on top of this crate's public
# API. That's what keeps the core portable if the shell ever moves off Tauri.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "fs", "time"] }
tracing = "0.1"
async-trait = "0.1"

# hot state store (process/behavior graph, live event ring buffer)
sled = "0.34"
bincode = "1"

# cold store (historical event log, analytical queries) - default backend
rusqlite = { version = "0.31", features = ["bundled"] }

# optional columnar/analytical backend, swap in with --features duckdb
duckdb = { version = "1", features = ["bundled"], optional = true }

# hashing / license verification
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["serde"] }
hex = "0.4"

# process + hardware introspection
sysinfo = "0.30"

# filesystem watching for the log interceptor
notify = "6"

# code parsing for the vulnerability heatmap
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-javascript = "0.21"

# locate CLI tools (trivy, gitleaks, stripe) on PATH
which = "6"

# local-only HTTP client for the Ollama integration (loopback calls to
# 127.0.0.1:11434) - a blocking client is the right shape here since
# every call site already dispatches through spawn_blocking, and it
# avoids pulling tokio's async HTTP stack in just for this.
ureq = { version = "2", features = ["json"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
once_cell = "1"
cron = "0.15"

[features]
default = []
duckdb-backend = ["dep:duckdb"]

# Windows-only: MachineGuid fallback for the hardware fingerprint, used when
# the SMBIOS UUID is unavailable or a firmware placeholder. See hwid.rs.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
